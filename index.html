<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080b14;
    color: white;
}

header {
    text-align: center;
    padding: 35px 15px 20px;
}

h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 900;
}

.warning {
    margin-top: 12px;
    color: #ffd166;
    font-size: 15px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.search {
    width: 100%;
    padding: 16px;
    border: 0;
    outline: none;
    border-radius: 14px;
    background: #171c2b;
    color: white;
    font-size: 17px;
}

.buttons,
.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

button {
    border: 0;
    padding: 11px 16px;
    border-radius: 10px;
    background: #20273a;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #5865f2;
}

.stats {
    text-align: center;
    color: #9ba5bd;
    margin: 20px 0;
}

#games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
}

.card {
    background: #151a27;
    border: 1px solid #262d42;
    border-radius: 15px;
    padding: 17px;
    min-height: 155px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: .15s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #5865f2;
}

.card h2 {
    font-size: 17px;
    margin: 0;
}

.source {
    color: #8e99b4;
    font-size: 12px;
    margin-top: 7px;
}

.play {
    display: block;
    text-align: center;
    padding: 10px;
    margin-top: 15px;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.play:hover {
    background: #707aff;
}

#loadMore {
    display: block;
    margin: 25px auto 50px;
}

footer {
    text-align: center;
    color: #687187;
    padding: 30px;
}

@media (max-width: 600px) {
    h1 {
        font-size: 30px;
    }

    #games {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .card {
        padding: 12px;
    }

    .card h2 {
        font-size: 14px;
    }
}
</style>
</head>

/*
====================================================
BUILD DATABASE
====================================================
*/

let database = games.map((game, index) => ({
    id: index,
    name: game[0],
    url: game[1],
    category: game[2]
}));

let filtered = [...database];

let currentIndex = 0;

const amount = 60;


/*
====================================================
DISPLAY
====================================================
*/

function displayGames() {

    const container =
        document.getElementById("games");

    container.innerHTML = "";

    currentIndex = 0;

    loadMore();
}


function loadMore() {

    const container =
        document.getElementById("games");

    const end =
        Math.min(
            currentIndex + amount,
            filtered.length
        );

    for (
        let i = currentIndex;
        i < end;
        i++
    ) {

        const game = filtered[i];

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div>
                <h2>${escapeHTML(game.name)}</h2>

                <div class="source">
                    ${escapeHTML(game.category)}
                </div>
            </div>

            <a
                class="play"
                href="${game.url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                PLAY
            </a>
        `;

        container.appendChild(card);
    }

    currentIndex = end;

    document.getElementById("loadMore").style.display =
        currentIndex >= filtered.length
            ? "none"
            : "block";

    updateStats();
}


/*
====================================================
SEARCH
====================================================
*/

document
.getElementById("search")
.addEventListener("input", function() {

    const search =
        this.value
        .toLowerCase()
        .trim();

    filtered =
        database.filter(game =>
            game.name
            .toLowerCase()
            .includes(search)
        );

    displayGames();
});


/*
====================================================
CATEGORY
====================================================
*/

function filterCategory(category) {

    if (category === "All") {

        filtered = [...database];

    } else {

        filtered =
            database.filter(game =>
                game.category === category
            );
    }

    document.getElementById("search").value = "";

    displayGames();
}


/*
====================================================
ALL
====================================================
*/

function showAll() {

    filtered = [...database];

    document.getElementById("search").value = "";

    displayGames();
}


/*
====================================================
RANDOM
====================================================
*/

function randomGame() {

    if (database.length === 0) return;

    const random =
        database[
            Math.floor(
                Math.random() *
                database.length
            )
        ];

    window.open(
        random.url,
        "_blank"
    );
}


function bored() {
    randomGame();
}


/*
====================================================
STATS
====================================================
*/

function updateStats() {

    document.getElementById("stats").textContent =
        `${filtered.length} games & websites`;
}


/*
====================================================
SECURITY
====================================================
*/

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
====================================================
KEYBOARD SHORTCUTS
====================================================
*/

document.addEventListener("keydown", function(event) {

    if (
        event.key === "/" &&
        document.activeElement.tagName !== "INPUT"
    ) {

        event.preventDefault();

        document
        .getElementById("search")
        .focus();
    }

    if (
        event.key.toLowerCase() === "r" &&
        document.activeElement.tagName !== "INPUT"
    ) {

        randomGame();
    }

});


/*
====================================================
START
====================================================
*/

displayGames();
