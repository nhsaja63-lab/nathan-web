<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nathan's Website</title>

<style>
:root{
  --bg:#070914;
  --panel:#101426;
  --panel2:#151b31;
  --text:#f4f7ff;
  --muted:#9da8c4;
  --accent:#7c5cff;
  --border:#252d49;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#17133a 0,#070914 50%);
  color:var(--text);
  font-family:Inter,system-ui,Segoe UI,sans-serif;
  min-height:100vh;
}

header{
  padding:42px 22px 25px;
  text-align:center;
}

h1{
  font-size:clamp(36px,7vw,68px);
  margin:0;
  font-weight:900;
  letter-spacing:-3px;
}

.hero{
  color:var(--muted);
  font-size:17px;
  margin:10px auto 20px;
  max-width:800px;
}

.warning{
  color:#ffd166;
  margin:10px;
  font-weight:700;
}

.toolbar{
  max-width:1100px;
  margin:auto;
  padding:0 18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

input,button{font:inherit}

#search{
  width:min(520px,100%);
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:13px 16px;
  border-radius:14px;
  outline:none;
}

button{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:11px 14px;
  border-radius:12px;
  cursor:pointer;
}

button:hover,.active{
  border-color:var(--accent);
  background:var(--panel2);
}

main{
  max-width:1200px;
  margin:28px auto;
  padding:0 18px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.card{
  background:linear-gradient(145deg,var(--panel),#0c1020);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  min-height:155px;
  display:flex;
  flex-direction:column;
  transition:.16s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#46517c;
}

.icon{font-size:34px}

.name{
  font-size:18px;
  font-weight:800;
  margin-top:9px;
}

.desc{
  font-size:13px;
  color:var(--muted);
  margin:6px 0 14px;
  line-height:1.35;
}

.row{
  display:flex;
  gap:8px;
  margin-top:auto;
}

.play{
  flex:1;
  text-decoration:none;
  text-align:center;
  background:var(--accent);
  color:white;
  padding:10px;
  border-radius:11px;
  font-weight:800;
}

.fav{
  width:44px;
  padding:0;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:34px 0 14px;
}

.section h2{margin:0}

#count{
  color:var(--muted);
  font-size:13px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 10px;
  display:none;
}

.funbox{
  margin-top:36px;
  background:linear-gradient(145deg,#11172c,#0b1020);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}

.funbuttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

#fortune{
  margin-top:16px;
  font-size:18px;
  min-height:28px;
}

/* AI BUTTON */

#aiButton{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9998;
  background:#7c5cff;
  color:white;
  border:none;
  padding:15px 21px;
  border-radius:16px;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 30px #0008;
}

/* AI WINDOW */

#aiWindow{
  display:none;
  position:fixed;
  right:20px;
  bottom:82px;
  width:390px;
  height:550px;
  background:#101426;
  border:1px solid #303952;
  border-radius:20px;
  z-index:9999;
  overflow:hidden;
  box-shadow:0 20px 60px #000b;
}

.aiHeader{
  height:60px;
  background:#171c31;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  font-size:18px;
  font-weight:900;
}

.aiHeader button{
  border:0;
  background:none;
  font-size:22px;
}

#aiMessages{
  height:430px;
  overflow-y:auto;
  padding:15px;
}

.aiMessage{
  max-width:85%;
  padding:11px 14px;
  border-radius:14px;
  margin-bottom:10px;
  white-space:pre-wrap;
  line-height:1.4;
}

.aiMessage.bot{
  background:#20263a;
}

.aiMessage.user{
  background:#7c5cff;
  margin-left:auto;
}

.aiInput{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  padding:9px;
  display:flex;
  gap:8px;
  background:#171c31;
}

.aiInput input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  border-radius:11px;
  background:#292f43;
  color:white;
  padding:10px;
}

.aiInput button{
  width:50px;
  background:#7c5cff;
  border:0;
  font-size:20px;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}

@media(max-width:500px){
  #aiWindow{
    left:10px;
    right:10px;
    width:auto;
    bottom:78px;
    height:520px;
  }

  #aiMessages{
    height:400px;
  }
}
</style>
</head>

/* =========================
   GAME SYSTEM
========================= */

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const count=document.getElementById("count");
const empty=document.getElementById("empty");

let category="All";

let favorites=JSON.parse(
localStorage.getItem("nathanFavorites")||"[]"
);


function render(){

const q=search.value.toLowerCase().trim();

const filtered=games.filter(g=>{

const matchesQ=
(g.name+" "+g.desc+" "+g.cat)
.toLowerCase()
.includes(q);

const matchesCat=
category==="All"
?true
:category==="Favorites"
?favorites.includes(g.name)
:g.cat===category;

return matchesQ && matchesCat;

});


grid.innerHTML=filtered.map(g=>`

<article class="card">

<div class="icon">${g.icon}</div>

<div class="name">
${g.name}
</div>

<div class="desc">
${g.desc}
</div>

<div class="row">

<a
class="play"
href="${g.url}"
target="_blank"
rel="noopener noreferrer"
>
PLAY →
</a>

<button
class="fav"
onclick="toggleFav('${g.name.replace(/'/g,"\\'")}')"
>
${favorites.includes(g.name)?"⭐":"☆"}
</button>

</div>

</article>

`).join("");

count.textContent=
`${filtered.length} games`;

empty.style.display=
filtered.length?"none":"block";

}


function toggleFav(name){

if(favorites.includes(name)){

favorites=favorites.filter(x=>x!==name);

}else{

favorites.push(name);

}

localStorage.setItem(
"nathanFavorites",
JSON.stringify(favorites)
);

render();

}


document.querySelectorAll(".filter")
.forEach(button=>{

button.addEventListener("click",()=>{

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

category=button.dataset.cat;

render();

});

});


search.addEventListener("input",render);

window.open(

);

/* =========================
   REAL AI
========================= */

/*
  CHANGE THIS TO YOUR CLOUDFLARE
  WORKER URL.
*/

const AI_BACKEND=
"nathan-ai.n4822041.workers.dev";


let aiHistory=[];


function openAI(){

document.getElementById("aiWindow")
.style.display="block";

document.getElementById("aiInput")
.focus();

}


function closeAI(){

document.getElementById("aiWindow")
.style.display="none";

}


function addAIMessage(text,type){

const box=
document.getElementById("aiMessages");

const message=
document.createElement("div");

message.className=
"aiMessage "+type;

message.textContent=text;

box.appendChild(message);

box.scrollTop=box.scrollHeight;

}


async function sendAI(){

const input=
document.getElementById("aiInput");

const text=input.value.trim();

if(!text)return;

input.value="";

addAIMessage(text,"user");

aiHistory.push({
role:"user",
content:text
});


const thinking=
document.createElement("div");

thinking.className="aiMessage bot";

thinking.textContent="🤔 Thinking...";

document
.getElementById("aiMessages")
.appendChild(thinking);


try{

const response=await fetch(
AI_BACKEND,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
messages:aiHistory
})

}
);


if(!response.ok){

throw new Error(
"AI server returned "+response.status
);

}


const data=await response.json();

thinking.remove();

const answer=
data.reply||
"Sorry, I couldn't generate a response.";


addAIMessage(answer,"bot");


aiHistory.push({
role:"assistant",
content:answer
});


}catch(error){

thinking.textContent=
"❌ AI connection failed.";

console.error(error);

}

}


document.getElementById("aiInput")
.addEventListener("keydown",event=>{

if(event.key==="Enter"){

sendAI();

}

});
