<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, #24135c 0%, transparent 35%),
        radial-gradient(circle at bottom right, #092b52 0%, transparent 35%),
        #080910;
    color: white;
    min-height: 100vh;
}

header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #292b3d;
    background: rgba(5,5,10,.8);
    backdrop-filter: blur(15px);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 42px;
    font-weight: 1000;
    letter-spacing: 3px;
}

.logo span {
    color: #8b5cff;
}

.subtitle {
    color: #8e91a8;
    margin-top: 6px;
}

.search {
    margin: 20px auto 0;
    max-width: 850px;
    display: flex;
    gap: 10px;
}

.search input {
    flex: 1;
    padding: 17px;
    border-radius: 15px;
    border: 1px solid #383b52;
    background: #11121b;
    color: white;
    font-size: 17px;
    outline: none;
}

.search input:focus {
    border-color: #8b5cff;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 13px 17px;
    color: white;
    background: #171925;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #272a3b;
    transform: translateY(-1px);
}

.controls {
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.category.active {
    background: #8b5cff;
}

.stats {
    max-width: 1400px;
    margin: auto;
    padding: 0 20px 10px;
    color: #9295ab;
}

.grid {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 15px;
}

.card {
    background: linear-gradient(145deg,#151722,#0e0f16);
    border: 1px solid #292c3c;
    border-radius: 17px;
    padding: 18px;
    min-height: 170px;
    transition: .2s;
    position: relative;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #7751dc;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.card h3 {
    margin: 5px 0 8px;
    font-size: 18px;
}

.card p {
    color: #8e91a8;
    font-size: 13px;
    line-height: 1.5;
    min-height: 40px;
}

.tag {
    display: inline-block;
    font-size: 11px;
    background: #242638;
    color: #aaaec6;
    border-radius: 20px;
    padding: 5px 8px;
}

.play {
    display: inline-block;
    margin-top: 10px;
    width: 100%;
    text-align: center;
    background: #8b5cff;
    color: white;
    padding: 11px;
    border-radius: 11px;
    text-decoration: none;
    font-weight: bold;
}

.play:hover {
    background: #a276ff;
}

.favorite {
    position: absolute;
    right: 12px;
    top: 12px;
    font-size: 20px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 80px 20px;
    color: #777b92;
    display: none;
}

footer {
    text-align: center;
    padding: 50px;
    color: #676a7c;
}

@media(max-width:600px) {
    .logo {
        font-size: 30px;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
        padding: 10px;
    }

    .card {
        padding: 13px;
    }
}
</style>
</head>

/* =========================================================
   FAVORITES
   ========================================================= */

let favorites =
    JSON.parse(localStorage.getItem("gameVaultFavorites") || "[]");

let currentCategory = "All";


/* =========================================================
   CATEGORIES
   ========================================================= */

const categories = [
    "All",
    ...new Set(sites.map(x => x[2]))
];

const categoriesDiv = document.getElementById("categories");

categories.forEach(cat => {

    const button = document.createElement("button");

    button.className = "category";
    button.textContent = cat;

    if(cat === "All")
        button.classList.add("active");

    button.onclick = () => {

        currentCategory = cat;

        document.querySelectorAll(".category")
            .forEach(x => x.classList.remove("active"));

        button.classList.add("active");

        render();
    };

    categoriesDiv.appendChild(button);
});


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    const query =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const grid = document.getElementById("grid");

    grid.innerHTML = "";

    const filtered = sites.filter(site => {

        const matchesSearch =
            !query ||
            site[0].toLowerCase().includes(query) ||
            site[1].toLowerCase().includes(query) ||
            site[2].toLowerCase().includes(query) ||
            site[3].toLowerCase().includes(query);

        const matchesCategory =
            currentCategory === "All" ||
            site[2] === currentCategory;

        return matchesSearch && matchesCategory;
    });

    document.getElementById("count").textContent =
        `${filtered.length} destinations`;

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";


    filtered.forEach((site,index) => {

        const [name,url,category,description] = site;

        const card = document.createElement("div");

        card.className = "card";

        const isFavorite = favorites.includes(url);

        card.innerHTML = `
            <div class="favorite"
                 onclick="toggleFavorite('${escapeJS(url)}',event)">
                ${isFavorite ? "⭐" : "☆"}
            </div>

            <span class="tag">${category}</span>

            <h3>${escapeHTML(name)}</h3>

            <p>${escapeHTML(description)}</p>

            <a
                class="play"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                🚀 OPEN
            </a>
        `;

        grid.appendChild(card);
    });
}


/* =========================================================
   SEARCH
   ========================================================= */

document
    .getElementById("search")
    .addEventListener("input",render);


/* =========================================================
   FAVORITES
   ========================================================= */

function toggleFavorite(url,event) {

    event.stopPropagation();

    if(favorites.includes(url)) {

        favorites =
            favorites.filter(x => x !== url);

    } else {

        favorites.push(url);
    }

    localStorage.setItem(
        "gameVaultFavorites",
        JSON.stringify(favorites)
    );

    render();
}


/* =========================================================
   RANDOM
   ========================================================= */

function randomSite() {

    const site =
        sites[Math.floor(Math.random() * sites.length)];

    window.open(
        site[1],
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================

   ========================================================= */

function bored() {

    const funCategories = [
        "Weird",
        "Experiments",
        "Random",
        "Games",
        "IO",
        "Music",
        "Art"
    ];

    const possible =
        sites.filter(x =>
            funCategories.includes(x[2])
        );

    const site =
        possible[Math.floor(Math.random() * possible.length)];

    window.open(
        site[1],
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener("keydown",e => {

    if(e.key === "/" &&
       document.activeElement.tagName !== "INPUT") {

        e.preventDefault();

        document.getElementById("search").focus();
    }

    if(e.key.toLowerCase() === "r" &&
       document.activeElement.tagName !== "INPUT") {

        randomSite();
    }
});


/* =========================================================
   SECURITY / TEXT HELPERS
   ========================================================= */

function escapeHTML(str) {

    return str
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeJS(str) {

    return str
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}
