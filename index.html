<title>Nathan's Website</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b12;
    color: white;
}

header {
    padding: 25px;
    text-align: center;
    background: #11111c;
    border-bottom: 1px solid #252536;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    color: #aaa;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 20px;
}

.search {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #151522;
    color: white;
    font-size: 17px;
    outline: none;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 15px 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    background: #202034;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #343450;
    transform: translateY(-1px);
}

.stats {
    color: #999;
    margin: 15px 0;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.category {
    white-space: nowrap;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.card {
    background: #151522;
    border: 1px solid #252538;
    border-radius: 15px;
    padding: 18px;
    min-height: 150px;
    transition: .15s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #555;
}

.card h3 {
    margin-top: 0;
}

.card p {
    color: #999;
    min-height: 38px;
}

.play {
    width: 100%;
    background: #5865f2;
}

.load {
    display: block;
    margin: 25px auto;
}

footer {
    text-align: center;
    padding: 40px;
    color: #777;
}

/* MEMES BUTTON */

.memeSide {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1000;
}

.memeSide button {
    background: #ff4d6d;
    font-size: 16px;
    padding: 15px 18px;
    box-shadow: 0 5px 20px #0008;
}

/* MEME PAGE */

#memePage {
    display: none;
    position: fixed;
    inset: 0;
    background: #090910;
    z-index: 2000;
    overflow-y: auto;
}

.memeHeader {
    padding: 20px;
    background: #11111c;
    border-bottom: 1px solid #29293c;
    display: flex;
    align-items: center;
    gap: 15px;
}

.memeHeader h2 {
    margin: 0;
}

.back {
    background: #303044;
}

.memeContainer {
    max-width: 1000px;
    margin: auto;
    padding: 25px;
}

.memeGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.memeButton {
    min-height: 110px;
    background: #171724;
    border: 1px solid #303047;
    border-radius: 15px;
    font-size: 18px;
}

.memeButton:hover {
    background: #24243a;
}

.memeEmoji {
    display: block;
    font-size: 35px;
    margin-bottom: 8px;
}
</style>

/* =========================
   GAME DISPLAY
========================= */

let filteredGames = games;
let visible = 60;

function displayGames() {

    const container = document.getElementById("games");

    container.innerHTML = "";

    filteredGames.slice(0, visible).forEach(game => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h3>🎮 ${escapeHTML(game[0])}</h3>
            <p>${escapeHTML(game[2])}</p>
            <button class="play" onclick="window.open('${game[1]}','_blank')">
                PLAY
            </button>
        `;

        container.appendChild(card);
    });

    updateStats();
}


function loadMore() {

    visible += 60;

    displayGames();

}


function showAll() {

    filteredGames = games;

    visible = 60;

    displayGames();

}


function filterCategory(category) {

    filteredGames = games.filter(game => game[2] === category);

    visible = 60;

    displayGames();

}


document.getElementById("search").addEventListener("input", function() {

    const search = this.value.toLowerCase();

    filteredGames = games.filter(game =>
        game[0].toLowerCase().includes(search)
    );

    visible = 60;

    displayGames();

});


function randomGame() {

    const game = games[Math.floor(Math.random() * games.length)];

    window.open(game[1], "_blank");

}


function bored() {

    randomGame();

}


function updateStats() {

    document.getElementById("stats").textContent =
        `${filteredGames.length} games & websites available`;

}


function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   MEME PAGE
========================= */

function openMemes() {

    document.getElementById("memePage").style.display = "block";

}


function closeMemes() {

    document.getElementById("memePage").style.display = "none";

}


/* =========================
   MEME SOUNDS
   Uses Web Audio API,
   so NO sounds folder is needed.
========================= */

let audioContext = null;

function getAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;

}


function tone(frequency, duration, type = "sine", volume = 0.3) {

    const ctx = getAudio();

    const oscillator = ctx.createOscillator();

    const gain = ctx.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        ctx.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(ctx.currentTime + duration);

}


/* VINE BOOM */

function vineBoom() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        150,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        35,
        ctx.currentTime + 0.55
    );

    gain.gain.setValueAtTime(
        0.9,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.6
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(ctx.currentTime + 0.6);

}


/* BRUH */

function bruh() {

    const ctx = getAudio();

    tone(180, 0.18, "sawtooth", 0.25);

    setTimeout(() => {
        tone(110, 0.45, "sawtooth", 0.3);
    }, 150);

}


/* AIRHORN */

function airhorn() {

    tone(450, 0.35, "square", 0.25);

    setTimeout(() => {
        tone(520, 0.35, "square", 0.25);
    }, 350);

}


/* BONK */

function bonk() {

    tone(120, 0.12, "square", 0.45);

    setTimeout(() => {
        tone(65, 0.25, "sine", 0.35);
    }, 80);

}


/* LAUGH */

function laugh() {

    const notes = [
        500,
        650,
        500,
        700,
        450,
        600
    ];

    notes.forEach((note, i) => {

        setTimeout(() => {
            tone(note, 0.12, "square", 0.18);
        }, i * 120);

    });

}


/* WOW */

function wow() {

    tone(350, 0.2, "sine", 0.25);

    setTimeout(() => {
        tone(700, 0.45, "sine", 0.3);
    }, 150);

}


/* SAD */

function sad() {

    tone(500, 0.35, "sine", 0.25);

    setTimeout(() => {
        tone(350, 0.5, "sine", 0.25);
    }, 350);

}


/* ERROR */

function errorSound() {

    tone(100, 0.12, "square", 0.35);

    setTimeout(() => {
        tone(80, 0.12, "square", 0.35);
    }, 150);

    setTimeout(() => {
        tone(55, 0.35, "square", 0.35);
    }, 300);

}


/* POP */

function pop() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        800,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        80,
        ctx.currentTime + 0.15
    );

    gain.gain.setValueAtTime(
        0.5,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.15
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(ctx.currentTime + 0.15);

}


/* BASS DROP */

function bass() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        180,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        30,
        ctx.currentTime + 1
    );

    gain.gain.setValueAtTime(
        0.5,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 1
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(ctx.currentTime + 1);

}


/* PLAY SELECTED MEME */

function playSound(sound) {

    if (sound === "vine") vineBoom();

    if (sound === "bruh") bruh();

    if (sound === "airhorn") airhorn();

    if (sound === "bonk") bonk();

    if (sound === "laugh") laugh();

    if (sound === "wow") wow();

    if (sound === "sad") sad();

    if (sound === "error") errorSound();

    if (sound === "pop") pop();

    if (sound === "bass") bass();

}


/* KEYBOARD SHORTCUT */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeMemes();
    }

});


/* START */

displayGames();
